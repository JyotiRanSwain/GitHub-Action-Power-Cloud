name: GitHub Advanced Security - Full Suite Scan

on:
  push:
    branches:
      - github-security
  pull_request:
    branches:
      - github-security
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  ghas-suite:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # --- 1. DEPENDENCY REVIEW FEATURE ---
      - name: Dependency Review Scan
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

      # --- 2. CODEQL CODE SCANNING FEATURE ---
      - name: Set up Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java
          queries: security-extended,security-and-quality

      - name: Clean and Build Project
        run: mvn clean package -DskipTests -Dmaven.compiler.useIncrementalCompilation=false

      - name: Create Results Output Directory
        run: mkdir -p results

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          output: results
          upload: true

      # --- 3. SARIF ARTIFACT DELIVERY ---
      - name: Upload SARIF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodeQL-SARIF-Report
          path: results/java.sarif
